---
deployment:
  tasks:
    - export DEPLOYPATH=/home/karmotor/public_html/medisa
    - /bin/test "$DEPLOYPATH" = "/home/karmotor/public_html/medisa"
    - /bin/test "$(/bin/pwd -P)" != "$DEPLOYPATH"
    - /bin/test ! -e "$DEPLOYPATH/.git"
    - /bin/test -d "$DEPLOYPATH"
    - /bin/test -f "$DEPLOYPATH/index.html"
    - /bin/test -f "$DEPLOYPATH/core.php"
    - /bin/test -f "$DEPLOYPATH/data/data.json"
    - /bin/test -d "$DEPLOYPATH/icon"
    - /bin/test -f "$DEPLOYPATH/icon/logo-header2.svg"
    - /bin/test -f "$DEPLOYPATH/icon/medisa-round-pwa-192.png"
    - /bin/test -f "$DEPLOYPATH/icon/medisa-round-pwa-512.png"
    - /bin/test "$(git branch --show-current)" = "main"
    - /bin/test -z "$(git status --porcelain)"
    - /bin/test -f index.html
    - /bin/test -f manifest.json
