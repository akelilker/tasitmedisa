    <style>
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #080d16;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10020; /* Footer (10000) üstünde; splash sırasında footer sızmaz */
            opacity: 1;
            transition: opacity 0.4s ease;
        }
        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loading-screen .splash-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            min-width: 150px;
            min-height: 0; /* Flex child shrink izni */
        }
        #loading-screen .splash-logo {
            width: 150px;
            height: 86px; /* SVG oranı 624.89:357.04 – layout shift önleme */
            flex-shrink: 0;
            object-fit: contain;
            filter: brightness(0.88);
        }
        @media (max-width: 640px) {
            #loading-screen .splash-inner { min-width: 120px; }
            #loading-screen .splash-logo { width: 120px !important; height: 69px !important; }
        }
        #loading-screen .splash-title {
            font-size: clamp(calc(16px - 0.5pt), 4.5vw, calc(24px - 0.5pt));
            font-weight: 800;
            letter-spacing: clamp(1px, 0.5vw, 4px);
            text-transform: uppercase;
            margin: 0;
            flex-shrink: 0;
            background: linear-gradient(to bottom, #c2d4df 0%, #ffffff 40%, #9aadba 52%, #d6e0e8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Inter', sans-serif;
        }
        /* CLS azaltma: CSS gelmeden önce modal/footer yerleşimini sabitle */
        .modal-overlay,
        .settings-dropdown,
        #centered-info-box {
            display: none;
        }
        .app-container {
            min-height: 100vh;
            min-height: 100dvh;
            box-sizing: border-box;
        }
        body.app-loading .app-container {
            visibility: hidden;
            opacity: 0;
        }
        body.main-auth-gate-active .content-wrap {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }

            position: fixed !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            bottom: 0 !important;
            width: 100% !important;
            max-width: 500px !important;

            visibility: visible !important;

    <script>
        (function() {
            function getMainAppBasePath() {
                try {
                    var path = (document.location && document.location.pathname) ? document.location.pathname : '/';
                    var parts = String(path || '/').split('/').filter(Boolean);
                    if (!parts.length) return '';
                    var lastPart = parts[parts.length - 1] || '';
                    if (lastPart.indexOf('.') !== -1) parts.pop();
                    var lastDir = (parts[parts.length - 1] || '').toLowerCase();
                    if (lastDir === 'admin' || lastDir === 'driver') parts.pop();
                    return parts.length ? ('/' + parts.join('/') + '/') : '';
                } catch (e) {
                    return '';
                }
            }

            function readStoredToken() {
                var keys = ['medisa_portal_token', 'driver_token'];
                for (var i = 0; i < keys.length; i++) {
                    var key = keys[i];
                    try {
                        var localValue = window.localStorage.getItem(key) || '';
                        if (localValue) return localValue;
                    } catch (e1) {}
                    try {
                        var sessionValue = window.sessionStorage.getItem(key) || '';
                        if (sessionValue) return sessionValue;
                    } catch (e2) {}
                }
                return '';
            }

            function hasUsableToken(token) {
                if (!token || typeof token !== 'string') return false;
                try {
                    var payload = null;
                    if (token.indexOf('.') !== -1) {
                        var parts = token.split('.');
                        if (parts.length !== 3) return false;
                        var body = parts[1].replace(/-/g, '+').replace(/_/g, '/');
                        while (body.length % 4) body += '=';
                        payload = JSON.parse(atob(body));
                    } else {
                        payload = JSON.parse(atob(token));
                    }
                    if (!payload || !payload.exp) return false;
                    return Number(payload.exp) >= Math.floor(Date.now() / 1000);
                } catch (e) {
                    return false;
                }
            }

            var token = readStoredToken();
            if (hasUsableToken(token)) return;

            var basePath = getMainAppBasePath();
            var loginUrl = (basePath || '/') + 'driver/index.html?portal=main-app';
            window.location.replace(loginUrl);
        })();
    </script>

            <script>
            /* medisa-shell-intent-bridge:begin */
            (function(global) {
              'use strict';
              if (global.MedisaShellIntentBridge && global.MedisaShellIntentBridge.__medisaBridgeReady) return;

              var PENDING_TIMEOUT_MS = 15000;
              var FAIL_MESSAGES = {
                'open-kayit': 'Kayıt ekranı yüklenemedi. Lütfen tekrar deneyin.',
                'open-tasitlar': 'Taşıtlar ekranı yüklenemedi. Lütfen tekrar deneyin.',
                'open-raporlar': 'Raporlar ekranı yüklenemedi. Lütfen tekrar deneyin.',
                'open-monthly-todo': 'Bu Ay Yapılacaklar hazırlanamadı. Lütfen tekrar deneyin.',
                'toggle-notifications': 'Bildirimler hazırlanamadı. Lütfen tekrar deneyin.',
                'toggle-settings': 'Ayarlar açılamadı. Lütfen tekrar deneyin.'
              };
              var TIMEOUT_MESSAGE = 'Bölüm hazırlanamadı. Lütfen tekrar deneyin.';
              var OFFLINE_MESSAGE = 'Bu bölüm ilk kullanım için internet bağlantısı gerektiriyor.';
              var handlers = Object.create(null);
              var pending = null;
              var executing = Object.create(null);
              var appReady = !!(global.__medisaAppReadyAt || global.__medisaAppReady);
              var sessionAllowed = true;
              var lastIntentKey = '';
              var lastIntentAt = 0;
              var errorShownAt = 0;
              var errorShownMessage = '';

              function doc() { return global.document || null; }

              function setStatus(text) {
                var el = doc() && doc().getElementById('medisa-shell-intent-status');
                if (el) el.textContent = text || '';
              }

              function clearBusy(el) {
                if (el && el.removeAttribute) el.removeAttribute('aria-busy');
              }

              function setBusy(el) {
                if (el && el.setAttribute) el.setAttribute('aria-busy', 'true');
              }

              function showError(message) {
                var msg = String(message || TIMEOUT_MESSAGE);
                var now = Date.now();
                if (now - errorShownAt < 900 && errorShownMessage === msg) return;
                errorShownAt = now;
                errorShownMessage = msg;
                if (typeof global.showCenteredInfoBox === 'function') {
                  global.showCenteredInfoBox(msg);
                  return;
                }
                if (typeof global.alert === 'function') global.alert(msg);
              }

              function isAuthGateActive() {
                try {
                  return !!(doc() && doc().body && doc().body.classList.contains('main-auth-gate-active'));
                } catch (e0) {
                  return false;
                }
              }

              function isSessionOk() {
                if (sessionAllowed === false) return false;
                if (global.__medisaShellIntentSessionFailed === true) return false;
                if (isAuthGateActive()) return false;
                try {
                  var s = global.medisaSession;
                  if (s && s.authenticated === false) return false;
                  if (s && (s.mustChangePassword === true || s.forcePasswordChange === true)) return false;
                } catch (e1) {}
                return true;
              }

              function clearPending() {
                if (!pending) return;
                if (pending.timer) {
                  clearTimeout(pending.timer);
                  pending.timer = null;
                }
                clearBusy(pending.sourceEl);
                pending = null;
                setStatus('');
              }

              function scheduleTimeout(entry) {
                if (entry.timer) clearTimeout(entry.timer);
                entry.timer = setTimeout(function() {
                  if (pending !== entry) return;
                  clearPending();
                  showError(TIMEOUT_MESSAGE);
                }, PENDING_TIMEOUT_MS);
              }

              function resolveFailureMessage(name) {
                try {
                  if (global.navigator && global.navigator.onLine === false) return OFFLINE_MESSAGE;
                } catch (e2) {}
                return FAIL_MESSAGES[name] || TIMEOUT_MESSAGE;
              }

              function tryDrain() {
                if (!pending) return;
                if (!appReady) return;
                if (!isSessionOk()) {
                  clearPending();
                  return;
                }
                var name = pending.name;
                var handler = handlers[name];
                if (typeof handler !== 'function') return;
                if (executing[name]) return;

                var entry = pending;
                pending = null;
                if (entry.timer) {
                  clearTimeout(entry.timer);
                  entry.timer = null;
                }
                executing[name] = true;
                setStatus('');

                Promise.resolve()
                  .then(function() { return handler(entry.context || {}); })
                  .then(function() { clearBusy(entry.sourceEl); })
                  .catch(function() {
                    clearBusy(entry.sourceEl);
                    // Ana surface lazy wrapper kendi hata UI'sını gösterir; çift alert yok.
                    if (name === 'open-kayit' || name === 'open-tasitlar' || name === 'open-raporlar') return;
                    showError(resolveFailureMessage(name));
                  })
                  .then(function() { delete executing[name]; }, function() { delete executing[name]; });
              }

              function request(intentName, context) {
                var name = String(intentName || '');
                if (!name) return;
                if (!isSessionOk()) {
                  clearPending();
                  return;
                }
                context = context || {};
                var sourceEl = context.sourceEl || null;
                if (executing[name]) return;
                if (pending && pending.name === name) return;

                if (pending) {
                  clearBusy(pending.sourceEl);
                  if (pending.timer) clearTimeout(pending.timer);
                  pending = null;
                }

                setBusy(sourceEl);
                setStatus('Bölüm hazırlanıyor…');
                pending = {
                  name: name,
                  context: context,
                  sourceEl: sourceEl,
                  timer: null,
                  requestedAt: Date.now()
                };
                scheduleTimeout(pending);
                tryDrain();
              }

              function register(intentName, handler) {
                var name = String(intentName || '');
                if (!name || typeof handler !== 'function') {
                  throw new Error('Geçersiz shell intent handler');
                }
                handlers[name] = handler;
                tryDrain();
              }

              function markAppReady() {
                appReady = true;
                global.__medisaAppReady = true;
                tryDrain();
              }

              function cancelSession() {
                sessionAllowed = false;
                global.__medisaShellIntentSessionFailed = true;
                clearPending();
              }

              function onDocumentClick(ev) {
                var t = ev && ev.target;
                if (!t || typeof t.closest !== 'function') return;
                var el = t.closest('[data-medisa-shell-intent]');
                if (!el) return;
                var intent = el.getAttribute('data-medisa-shell-intent');

                if (ev && typeof ev.preventDefault === 'function') ev.preventDefault();
                if (ev && typeof ev.stopPropagation === 'function') ev.stopPropagation();

                var now = Date.now();
                if (key === lastIntentKey && (now - lastIntentAt) < 350) return;

                lastIntentAt = now;
                request(intent, { sourceEl: el, event: ev });
              }

                doc().addEventListener('click', onDocumentClick, true);
              }

                request: request,
                register: register,
                markAppReady: markAppReady,
                isAppReady: function() { return !!appReady; },
                hasPending: function(intentName) {
                  if (!pending) return false;
                  if (!intentName) return true;
                  return pending.name === String(intentName);
                },
                clear: function(intentName) {
                  if (!pending) return;
                  if (intentName && pending.name !== String(intentName)) return;
                  clearPending();
                },
                cancelSession: cancelSession,
                PENDING_TIMEOUT_MS: PENDING_TIMEOUT_MS,
                __medisaBridgeReady: true
              };
            })(typeof window !== 'undefined' ? window : this);
            /* medisa-shell-intent-bridge:end */

    <!-- INLINE KRITIK JS: Harici script dosyaları 404 olsa bile loading screen kapanır -->
    <script>
    (function(){
      // 1. Splash: JS controlled dismiss — app-ready sinyali + min süre; en geç MAX fallback
      var MIN_SPLASH_MS = 2000;
      var MAX_SPLASH_MS = 8000;
      var _start = Date.now();
      var appReady = false;
      var dismissed = false;

      // Güvenli kapatma: her yolda app-loading kaldırılır
      function hideLoading() {
        if (dismissed) return;
        dismissed = true;
        try {
          window.__medisaSplashHiddenAt = Date.now();
          if (window.__medisaMainShellMetrics) {
            window.__medisaMainShellMetrics.splashHiddenAt = window.__medisaSplashHiddenAt;
          }
        } catch (eSplash) {}
        var ls = document.getElementById('loading-screen');
        if (!ls) {
          if (document.body) document.body.classList.remove('app-loading');
          return;
        }
        ls.classList.add('hidden');
        setTimeout(function(){
          ls.style.display = 'none';
          if (document.body) document.body.classList.remove('app-loading');
        }, 350);
      }

      function tryDismissSplash() {
        if (dismissed) return;
        var elapsed = Date.now() - _start;
        if (appReady && elapsed >= MIN_SPLASH_MS) {
          hideLoading();
          return;
        }
        if (elapsed >= MAX_SPLASH_MS) {
          hideLoading();
          return;
        }
        // App hazır ama min marka süresi dolmadıysa kalan süre sonrası tekrar dene
        if (appReady) {
          setTimeout(tryDismissSplash, Math.max(50, MIN_SPLASH_MS - elapsed));
        }
      }

      // Ready sinyali owner: data-manager / script-core dataLoaded akışı çağırır
      window.medisaNotifyAppReady = function medisaNotifyAppReady() {
        appReady = true;
        try {
          window.__medisaAppReady = true;
          window.__medisaAppReadyAt = Date.now();
          if (window.__medisaMainShellMetrics) {
            window.__medisaMainShellMetrics.appReadyAt = window.__medisaAppReadyAt;
          }
        } catch (eReady) {}
        try {
          if (window.MedisaShellIntentBridge && typeof window.MedisaShellIntentBridge.markAppReady === 'function') {
            window.MedisaShellIntentBridge.markAppReady();
          }
        } catch (eBridgeReady) {}
        tryDismissSplash();
      };
      // Geriye uyumluluk: eski (cache'li) script-core doğrudan çağırırsa güvenli kapatma
      window.hideLoading = hideLoading;

      // MAX fallback: app-ready hiç gelmese de splash asılı kalmasın
      setTimeout(tryDismissSplash, MAX_SPLASH_MS);

      // 2. CSS async load fallback: onerror durumunda media='all' yap (print kalmayı önle)
      document.querySelectorAll('link[rel="stylesheet"][media="print"]').forEach(function(link){
        if (!link.onload) {
          link.onload = function(){ this.media = 'all'; };
        }
        link.onerror = function(){
          // CSS 404 olursa print modunda kalmasın, yine de dene
          this.media = 'all';
        };
      });

      // 3. Harici script yükleme hatası tespiti (konsola yaz, kullanıcıyı bilgilendir)
      window.addEventListener('error', function(e){
        if (e.target && e.target.tagName === 'SCRIPT' && e.target.src) {
          console.warn('[Medisa] Script yüklenemedi:', e.target.src);
          hideLoading(); // Script 404 ise loading'i kapat
        }
      }, true);
    })();
    </script>
