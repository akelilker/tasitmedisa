<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Belge modal hover fixture</title>
  <link rel="stylesheet" href="../../style-core.css?v=20260926.3" />
  <link rel="stylesheet" href="../../tasitlar-base.css" />
  <link rel="stylesheet" href="../../tasitlar-extra.css?v=20260926.11" />
  <style>
    body { margin: 0; background: #0f1419; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    #dinamik-olay-modal { display: flex !important; position: static; width: 520px; }
    #dinamik-olay-modal .modal-container { width: 100%; }
    #dinamik-olay-modal .modal-body { padding: 24px; }
  </style>
</head>
<body>
  <div id="dinamik-olay-modal" class="modal-overlay active olay-ekle-modal" data-event-type="documents">
    <div class="modal-container">
      <div class="modal-body">
        <div id="ruhsat-modal-content">
          <section id="fixture-present" aria-label="Yüklü belge">
            <h2 style="color:#fff;font-size:14px;margin:0 0 8px;">Yüklü belge</h2>
            <div class="universal-btn-group ruhsat-preview-row medisa-doc-action-row">
              <div class="medisa-doc-action-row__start">
                <button type="button" class="ruhsat-download-btn icon-btn" id="btn-download" aria-label="İndir">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                </button>
              </div>
              <div class="medisa-doc-action-row__center">
                <button type="button" class="ruhsat-preview-link document-presence--present" id="btn-preview" aria-label="Belge">
                  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                </button>
              </div>
              <div class="ruhsat-doc-actions medisa-doc-action-row__end">
                <button type="button" class="ruhsat-add-btn icon-btn" id="btn-add">+</button>
                <button type="button" class="ruhsat-remove-btn icon-btn" id="btn-remove">&minus;</button>
              </div>
            </div>
            <div class="ruhsat-policy-date-stack">
              <div class="olay-date-mobile-wrap">
                <div class="olay-date-mobile-picker-slot">
                  <button type="button" class="olay-date-mobile-btn" id="btn-calendar" aria-label="Tarih">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                  </button>
                </div>
              </div>
            </div>
          </section>
          <section id="fixture-missing" aria-label="Eksik belge" style="margin-top:32px;">
            <h2 style="color:#fff;font-size:14px;margin:0 0 8px;">Eksik Kasko</h2>
            <div class="medisa-doc-action-row medisa-doc-status-row">
              <div class="medisa-doc-action-row__center">
                <span class="ruhsat-preview-link document-presence--missing" aria-hidden="true">
                  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><line x1="9" y1="15" x2="15" y2="9"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
                </span>
              </div>
              <div class="ruhsat-doc-actions medisa-doc-action-row__end">
                <div class="ruhsat-upload-box">
                  <button type="button" class="ruhsat-select-box icon-btn" id="btn-missing-upload"><span class="ruhsat-select-box-icon">+</span></button>
                </div>
              </div>
            </div>
          </section>
          <div id="ruhsat-btn-group" class="universal-btn-group ruhsat-single-visible olay-form-buttons" style="margin-top:24px;">
            <button type="button" class="universal-btn-cancel" id="btn-cancel">Vazgeç</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
