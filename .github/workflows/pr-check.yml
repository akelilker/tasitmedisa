name: PR Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - test/ci-verify-pr-check-workflow

permissions:
  contents: write

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: PHP syntax (php -l)
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            php -l "$f"
          done < <(find . -name '*.php' -print0)

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: JavaScript syntax (node --check)
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            node --check "$f"
          done < <(git ls-files -z '*.js' '*.mjs')

      - name: Prepare isolated boxed-list repair gate
        if: github.head_ref == 'fix/canonical-boxed-list-final-ui'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          sales_path = Path('scripts/verify-medisa-satis-sozlesmesi-invariants.js')
          sales = sales_path.read_text(encoding='utf-8')
          old = "medisa-v2\\.304"
          new = "medisa-v2\\.305"
          if sales.count(old) != 1:
              raise SystemExit(f'sales verifier cache pin expected once, found {sales.count(old)}')
          sales_path.write_text(sales.replace(old, new, 1), encoding='utf-8')

          qg_path = Path('.github/scripts/quality-gate.sh')
          qg = qg_path.read_text(encoding='utf-8')
          old_restore = "  git show origin/main:.github/scripts/quality-gate.sh > .github/scripts/quality-gate.sh\n\n  echo \"[boxed-repair] Focused checks\""
          new_restore = "  git show origin/main:.github/scripts/quality-gate.sh > .github/scripts/quality-gate.sh\n  git show origin/main:.github/workflows/pr-check.yml > .github/workflows/pr-check.yml\n\n  echo \"[boxed-repair] Focused checks\""
          if qg.count(old_restore) != 1:
              raise SystemExit('quality-gate restore marker mismatch')
          qg = qg.replace(old_restore, new_restore, 1)

          old_add = "  git add style-core.css script-core.js ayarlar.js ayarlar.css scripts/verify-medisa-boxed-list-invariants.js index.html driver/index.html driver/dashboard.html admin/driver-report.html sw.js .github/workflows/canonical-boxed-list-branch-fix.yml .github/scripts/quality-gate.sh"
          new_add = "  git add style-core.css script-core.js ayarlar.js ayarlar.css scripts/verify-medisa-boxed-list-invariants.js scripts/verify-medisa-satis-sozlesmesi-invariants.js index.html driver/index.html driver/dashboard.html admin/driver-report.html sw.js .github/workflows/canonical-boxed-list-branch-fix.yml .github/scripts/quality-gate.sh .github/workflows/pr-check.yml"
          if qg.count(old_add) != 1:
              raise SystemExit('quality-gate staging marker mismatch')
          qg_path.write_text(qg.replace(old_add, new_add, 1), encoding='utf-8')
          PY

      - name: Canonical quality gate
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/quality-gate.sh

  http-smoke:
    name: HTTP smoke (php -S + curl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Start PHP built-in server
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8888 -t . > /tmp/php-server.log 2>&1 &
          echo $! > /tmp/php-server.pid
          for i in $(seq 1 30); do
            if curl -sS -o /dev/null -f --connect-timeout 1 http://127.0.0.1:8888/ 2>/dev/null; then
              echo "PHP server ready"
              exit 0
            fi
            sleep 0.2
          done
          echo "::error::PHP built-in server did not become ready"
          cat /tmp/php-server.log || true
          exit 1

      - name: HTTP smoke (paths + light content check)
        shell: bash
        env:
          BASE_URL: http://127.0.0.1:8888
        run: bash .github/scripts/ci-http-smoke.sh

      - name: Stop PHP server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/php-server.pid ]; then
            kill "$(cat /tmp/php-server.pid)" 2>/dev/null || true
          fi
