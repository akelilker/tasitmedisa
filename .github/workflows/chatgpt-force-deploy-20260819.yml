name: ChatGPT One Shot cPanel Deploy 20260819

on:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

env:
  FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR || vars.FTP_REMOTE_DIR }}
  FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
  FTP_PORT: ${{ vars.FTP_PORT || '21' }}
  FTP_SECURITY: ${{ vars.FTP_SECURITY || 'loose' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Guard expected mobile fix
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2bf17d70ed80771310a12ef4555daf4e1852bc46 HEAD
          grep -q 'style-core.css?v=20260819.1' index.html
          grep -q "tasitlar: '20260819.1'" script-core.js

      - name: Validate FTP configuration
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          for n in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_REMOTE_DIR; do
            v="${!n:-}"
            test -n "$v" || { echo "::error::$n missing"; exit 1; }
          done
          test "${FTP_REMOTE_DIR%/}" != "$FTP_REMOTE_DIR"

      - name: Sync production files via canonical FTP path
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ env.FTP_REMOTE_DIR }}
          local-dir: ./
          log-level: verbose
          protocol: ${{ env.FTP_PROTOCOL }}
          port: ${{ env.FTP_PORT }}
          security: ${{ env.FTP_SECURITY }}
          timeout: 600000
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            **/.cursor/**
            **/.agents/**
            **/.vscode/**
            **/outputs/**
            **/tmp/**
            docs/**
            scripts/**
            _ux-test-output/**
            assets/**
            .cpanel.yml
            .cursorignore
            .editorconfig
            AGENTS.md
            DEPLOYMENT.md
            DEVELOPER_REPORT.md
            README.md
            package.json
            **/*.zip
            data/**

      - name: Verify live asset parity
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          for file in index.html style-core.css script-core.js driver/driver-shell.css tasitlar.js; do
            tmp="$(mktemp)"
            curl --fail --silent --show-error --location --connect-timeout 15 --max-time 45 --retry 3 --retry-delay 3 "https://karmotors.com.tr/medisa/${file}?deploy_sha=${GITHUB_SHA}" -o "$tmp"
            local_sha="$(sha256sum "$file" | awk '{print $1}')"
            remote_sha="$(sha256sum "$tmp" | awk '{print $1}')"
            rm -f "$tmp"
            test "$local_sha" = "$remote_sha" || { echo "::error::Live asset mismatch: $file"; exit 1; }
          done
